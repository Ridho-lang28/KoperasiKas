<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KoperasiKas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#DC1B33', dark: '#1e1e2e' } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex overflow-hidden bg-gray-50">
    <!-- Bagian Kiri Merah -->
    <div class="hidden lg:flex w-1/2 bg-primary text-white flex-col justify-center p-16 relative overflow-hidden">
        <div class="absolute top-[-50px] right-[-50px] w-96 h-96 bg-white opacity-10 rounded-full"></div>
        <div class="relative z-10">
            <h1 class="text-4xl font-extrabold mb-6">Selamat Datang Kembali</h1>
            <p class="text-white/80 max-w-md">Kelola keuangan koperasi dengan mudah dan transparan.</p>
        </div>
    </div>

    <!-- Bagian Kanan Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
        <div class="w-full max-w-md">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Login Admin</h2>
            <form id="loginForm" class="space-y-5 mt-8">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Username / Email</label>
                    <input type="text" id="email" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:border-primary" placeholder="admin@koperasi.id" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:border-primary" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full py-3.5 bg-primary text-white font-semibold rounded-xl hover:bg-red-700 transition">Masuk Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Memproses...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('koperasikas_user', JSON.stringify(data.data));
                    Swal.fire({icon: 'success', title: 'Berhasil!', timer: 1500, showConfirmButton: false});
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    Swal.fire({icon: 'error', title: 'Gagal', text: data.error});
                }
            } catch (err) {
                Swal.fire({icon: 'error', title: 'Error Jaringan', text: 'Cek koneksi atau server sedang down'});
                console.error(err);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
